# DSH-WeChatClawBot bundle: WeChat floating-ball bridge (host + client plugins).
# Install: dsh plugin --profile web add github:lubaiUwU/DSH-WeChatClawBot
- insert:
    - id: wechat-bot
      name: dsh-wechat-bot
      config:
        gatewayPort: 51235
        sessionMode: active
        timeoutMs: 300000
        maxMessageChars: 20000
        approval: reject
    - id: wechat-ui
      name: dsh-client-wechat-ui
